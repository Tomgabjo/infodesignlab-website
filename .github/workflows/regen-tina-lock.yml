name: Regenerate tina-lock.json with image/template changes

# Manual trigger only — run this after the config changes are ready.
on:
  workflow_dispatch:

jobs:
  regen-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allows git push back to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN (has contents: write on this repo)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply TinaCMS config changes
        run: python3 scripts/apply-tina-templates.py

      - name: Generate tina-lock.json (local schema compile)
        env:
          # Public client ID — safe to include here (the repo is already public)
          TINA_PUBLIC_CLIENT_ID: '9eb10f76-fc67-47a5-86a1-c8365309eaf1'
          # TINA_TOKEN is deliberately omitted; --skip-cloud-checks bypasses
          # the cloud authentication so only the local schema compile runs.
          # If this step fails with an auth error, add TINA_TOKEN as a
          # GitHub Actions secret and uncomment the next line:
          # TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tinacms build --skip-cloud-checks

      - name: Commit config + lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tina/config.ts tina/tina-lock.json
          if git diff --staged --quiet; then
            echo "Nothing to commit — files already up to date."
          else
            git commit -m "feat: Figure/Figures templates + image picker for cover (generated by workflow)"
            git push
            echo "✓ Committed and pushed. Netlify will rebuild automatically."
          fi
