name: Regenerate tina-lock.json with image/template changes

# Manual trigger only — run this after the config changes are ready.
on:
  workflow_dispatch:

jobs:
  regen-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allows git push back to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN (has contents: write on this repo)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NOTE: the "apply config changes" step that used to run here has been
      # removed — tina/config.ts already has the mediaRoot, cover-as-image,
      # and Figure/Figures template changes committed to main. This workflow
      # now only regenerates tina-lock.json to match.

      - name: Generate tina-lock.json (via tinacms dev, headless)
        env:
          # Public client ID — safe to include here (the repo is already public)
          TINA_PUBLIC_CLIENT_ID: '9eb10f76-fc67-47a5-86a1-c8365309eaf1'
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          # `tinacms build` does NOT write tina-lock.json — confirmed upstream
          # bug (TinaCMS PR #7051, still an open draft, unreleased as of Aug
          # 2026). Only `tinacms dev` regenerates the lock file, because the
          # lock-write step only runs from dev's startup path, right after
          # codegen — before dev's GraphQL server actually starts listening.
          # `dev` normally stays running as a server, so we bound it with
          # `timeout` and let it get killed once codegen + the lock write
          # have had time to finish.
          timeout 150 npx tinacms dev --noWatch --skip-cloud-checks --skip-search-indexing || true
          echo "--- tina-lock.json diff after dev run ---"
          git diff --stat tina/tina-lock.json || true

      - name: Verify the lock file actually changed
        run: |
          if git diff --quiet tina/tina-lock.json; then
            echo "ERROR: tina-lock.json did not change. The dev run may not have finished writing it — rerun with a longer timeout, or check the log above for a CLI error." >&2
            exit 1
          fi
          echo "tina-lock.json changed as expected — proceeding to commit."

      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tina/tina-lock.json
          if git diff --staged --quiet; then
            echo "Nothing to commit — files already up to date."
          else
            git commit -m "feat: regenerate tina-lock.json for Figure/Figures templates + image cover field"
            git push
            echo "✓ Committed and pushed. Netlify will rebuild automatically."
          fi
